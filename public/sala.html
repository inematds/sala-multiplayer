<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sala multiplayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<section class="topo">
  <div class="kpi"><div class="r">Mensagens na última hora</div><div class="v" id="k-msgs">0</div><div class="s">pessoas, agentes e ferramentas</div></div>
  <div class="kpi"><div class="r">Agentes trabalhando</div><div class="v" id="k-ativos">0</div><div class="s" id="k-ativos-n">nenhum agora</div></div>
  <div class="kpi chama" id="k-aprov-box" role="button" tabindex="0"><div class="r">Aprovações pendentes</div><div class="v" id="k-aprov">0</div><div class="s">clique para ver e decidir</div></div>
  <div class="kpi"><div class="r">Respostas de agentes hoje</div><div class="v" id="k-hoje">0</div><div class="s" id="k-teto">teto diário</div></div>
</section>
<section class="aprov" id="aprov"><h3>Esperando aprovação humana</h3><div id="aprov-lista"></div></section>
<main class="sala">
  <div class="abas-movel" role="group" aria-label="ver">
    <button class="tab on" data-aba="conversa">Conversa</button>
    <button class="tab" data-aba="topicos">Tópicos <span id="n-top"></span></button>
  </div>
  <aside class="lado">
    <div class="tabs" id="tabs">
      <button class="tab on" data-t="todos">Todos</button>
      <button class="tab" data-t="pessoa">Pessoas</button>
      <button class="tab" data-t="agente">Agentes</button>
      <button class="tab" data-t="ferramenta">Ferramentas</button>
    </div>
    <div class="lista" id="lista"></div>
  </aside>
  <section class="chat">
    <div class="cab">
      <select id="conversa" aria-label="conversa"></select>
      <span class="filtro" id="filtro"></span>
    </div>
    <div class="resumo-top" id="resumo" hidden></div>
    <div class="msgs" id="msgs"></div>
    <div class="dica" id="dica"></div>
    <form class="comp" id="comp">
      <select id="eu" aria-label="você é"></select>
      <textarea id="texto" rows="1" placeholder="Escreva... use @claude ou @codex para chamar um agente"></textarea>
      <button class="btn pri" type="submit">Enviar</button>
    </form>
  </section>
  <aside class="topicos" id="topicos" aria-label="tópicos"></aside>
</main>
<script type="module">
import { S, iniciar, nav, icone, esc, hora, part, classe, nomeConversa, postar, ROTULO } from '/comum.js';
import { rodadas, resolucao } from '/rodadas.js';

let aba = 'todos', sel = new URLSearchParams(location.search).get('p'), conversa = 'todas';
let selTop = Number(new URLSearchParams(location.search).get('t')) || null;
const $ = (id) => document.getElementById(id);
let eu = (() => { try { return localStorage.getItem('sala-eu'); } catch { return null; } })();

await iniciar((tipo) => { render(tipo); });
nav('sala');
const equipe = S.estado.perfil.equipe;
if (!equipe.some((p) => p.id === eu)) eu = equipe[0].id;
$('eu').innerHTML = equipe.map((p) => `<option value="${p.id}" ${p.id === eu ? 'selected' : ''}>Você é: ${esc(p.nome)}</option>`).join('');
$('eu').onchange = (e) => { eu = e.target.value; try { localStorage.setItem('sala-eu', eu); } catch {} render(); };
document.querySelectorAll('.tab').forEach((b) => b.onclick = () => { aba = b.dataset.t; document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b)); render(); });
$('conversa').onchange = (e) => { conversa = e.target.value; render(); };
$('k-aprov-box').onclick = () => $('aprov').classList.toggle('aberta');
const verAba = (a) => { document.body.classList.toggle('aba-topicos', a === 'topicos'); document.querySelectorAll('.abas-movel .tab').forEach((b) => b.classList.toggle('on', b.dataset.aba === a)); };
document.querySelectorAll('.abas-movel .tab').forEach((b) => b.onclick = () => verAba(b.dataset.aba));
$('texto').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('comp').requestSubmit(); } });
$('comp').onsubmit = async (e) => {
  e.preventDefault();
  const texto = $('texto').value.trim();
  if (!texto) return;
  $('texto').value = '';
  await postar('/api/mensagem', { de: eu, conversa: conversa === 'todas' ? 'painel' : conversa, texto });
};

function contagem(id) { return S.estado.eventos.filter((e) => e.de === id || e.para === id).length; }
// Prestação de contas do agente: respostas hoje e tempo médio por resposta.
function contas(id) {
  const c = S.estado.contas[id];
  return c ? ` · ${c.hoje} hoje · ${String(c.mediaS).replace('.', ',')}s/resposta` : '';
}
const NIVEL_TXT = { super: 'super (o mais forte)', topo: 'topo', executor: 'executor (padrão)', menor: 'menor (rápido)' };
function modeloDe(motor, nivel) { return S.estado.niveis?.[nivel]?.[motor]?.modelo || 'padrão do CLI'; }
function esforcoDe(motor, nivel) { return S.estado.niveis?.[nivel]?.[motor]?.esforco || 'padrão'; }
function infoAgente(id) {
  const g = S.estado.agentes?.find((x) => x.id === id);
  return g ? ` · ${modeloDe(g.motor, g.nivel)}${g.esforco ? ' ' + g.esforco : ''}` : '';
}
function cartaoConfig(a) {
  return `<div class="ap" data-id="${a.id}">
    <div class="q">#${a.id} · ${esc(part(a.de).nome)} propõe mudar a configuração · pedido de ${esc(part(a.para).nome)} · ${hora(a.hora)}</div>
    <div class="prop">${esc(a.texto)}</div>
    <label class="senha">Só o dono decide. Senha do dono <input type="password" data-senha autocomplete="current-password"></label>
    <div class="acoes"><button class="btn pri" data-a="aprovar">Aprovar mudança</button><button class="btn" data-a="recusar">Recusar</button></div>
  </div>`;
}
function cartaoConvite(a) {
  return `<div class="ap" data-id="${a.id}">
    <div class="q">#${a.id} · pedido de entrada pelo Telegram · ${hora(a.hora)}</div>
    <div class="prop">${esc(a.texto)}<div><span class="r">Como convidado</span> conversa e chama os agentes; não aprova nada nem muda a configuração. Teto de ${S.estado.config?.teto_convidado ?? 30} respostas por dia.</div></div>
    <label class="senha">Só o dono decide. Senha do dono <input type="password" data-senha autocomplete="current-password"></label>
    <div class="acoes"><button class="btn pri" data-a="aprovar">Aceitar convidado</button><button class="btn" data-a="recusar">Recusar</button></div>
  </div>`;
}
function cartaoAgente(a) {
  const g = a.dados.agente, est = a.dados.estimativa;
  const linha = (r, v) => v ? `<div><span class="r">${r}</span> ${esc(v)}</div>` : '';
  const nivelSel = Object.keys(NIVEL_TXT).map((n) => `<option value="${n}" ${n === (g.nivel || 'executor') ? 'selected' : ''}>${NIVEL_TXT[n]} · ${esc(modeloDe(g.motor, n))}</option>`).join('');
  const esfSel = ['', 'low', 'medium', 'high', 'xhigh'].map((v) => `<option value="${v}" ${v === (g.esforco || '') ? 'selected' : ''}>${v || 'do nível (' + esc(esforcoDe(g.motor, g.nivel || 'executor')) + ')'}</option>`).join('');
  return `<div class="ap" data-id="${a.id}">
    <div class="q">#${a.id} · ${esc(part(a.de).nome)} propõe um agente novo · pedido de ${esc(part(a.para).nome)} · ${hora(a.hora)}</div>
    <div class="prop"><b>@${esc(g.id)} · ${esc(g.nome)}</b>
      ${linha('Motor', g.motor === 'codex' ? 'Codex' : 'Claude Code')}${linha('Papel', g.papel)}${linha('Jeito', g.persona)}
      ${linha('Ferramentas', est.ferramentas)}${linha('Teto', `${g.teto_diario} respostas por dia`)}
      ${linha('Tempo', est.tempo)}${linha('Custo', est.custo)}${linha('Por quê', g.justificativa)}</div>
    <div class="ajustes">
      <label>Modelo <select data-k="nivel">${nivelSel}</select></label>
      <label>Esforço <select data-k="esforco">${esfSel}</select></label>
      <label>Resposta até <input data-k="linhas_max" type="number" min="1" max="60" value="${g.linhas_max || 15}"> linhas</label>
    </div>
    <div class="acoes"><button class="btn pri" data-a="aprovar">Aprovar e criar agente</button><button class="btn" data-a="recusar">Recusar</button></div>
  </div>`;
}

function render() {
  const e = S.estado;
  // topo
  $('k-msgs').textContent = e.stats.msgsHora;
  $('k-ativos').textContent = e.ativos.length;
  $('k-ativos-n').textContent = e.ativos.length ? e.ativos.map((id) => part(id).nome).join(', ') : 'nenhum agora';
  $('k-aprov').textContent = e.pendentes.length;
  $('k-aprov-box').classList.toggle('tem', e.pendentes.length > 0);
  $('k-hoje').textContent = e.stats.chamadasHoje;
  $('k-teto').textContent = `teto diário: ${e.perfil.teto_diario}`;
  $('dica').textContent = `Agentes: ${e.participantes.filter((p) => p.tipo === 'agente').map((p) => '@' + p.id).join(', ')} · até ${e.config?.teto_rodada ?? 12} respostas de agentes por mensagem · peça "cria um agente que..." para propor um novo`;
  // aprovações (não redesenha um rascunho que está sendo editado)
  const lista = $('aprov-lista');
  const emEdicao = lista.contains(document.activeElement);
  if (!emEdicao) {
    lista.innerHTML = e.pendentes.length ? e.pendentes.map((a) => a.tipo === 'agente' ? cartaoAgente(a) : a.tipo === 'config' ? cartaoConfig(a) : a.tipo === 'convite' ? cartaoConvite(a) : `
      <div class="ap" data-id="${a.id}">
        <div class="q">#${a.id} · ${esc(part(a.de).nome)} → ${esc(part(a.para).nome)} · ${esc(nomeConversa(a.conversa))} · ${hora(a.hora)}</div>
        <textarea aria-label="texto da resposta">${esc(a.texto)}</textarea>
        <div class="acoes"><button class="btn pri" data-a="aprovar">Aprovar e enviar</button><button class="btn" data-a="recusar">Recusar</button></div>
      </div>`).join('') : '<div class="q">Nada esperando.</div>';
    lista.querySelectorAll('button[data-a]').forEach((b) => b.onclick = async () => {
      const box = b.closest('.ap');
      b.disabled = true;
      const ajustes = box.querySelector('.ajustes') ? Object.fromEntries([...box.querySelectorAll('.ajustes [data-k]')].map((c) => [c.dataset.k, c.type === 'number' ? Number(c.value) : c.value])) : undefined;
      const r = await postar(`/api/${b.dataset.a}`, { id: box.dataset.id, de: eu, texto: box.querySelector('textarea')?.value, ajustes, senha: box.querySelector('[data-senha]')?.value });
      if (r.erro) { b.disabled = false; alertaInline(box, r.erro); }
    });
  }
  // participantes
  const ps = e.participantes.filter((p) => p.tipo !== 'sistema' && (aba === 'todos' || p.tipo === aba));
  $('lista').innerHTML = ps.map((p) => {
    const c = classe(p);
    const off = p.ativo === 0;
    return `<div class="pp ${sel === p.id ? 'on' : ''} ${off ? 'off' : ''}" data-id="${p.id}" role="button" tabindex="0">
      <span class="t-${c}" title="${ROTULO[c]}">${icone(c)}</span>
      <div><div class="nm">${esc(p.nome)}</div><div class="pa">${ROTULO[c]}${p.origem === 'proposta' ? ' novo' : ''}${p.tipo === 'agente' ? infoAgente(p.id) + contas(p.id) : ''}${p.papel ? ' · ' + esc(p.papel) : ''}${p.origem === 'telegram' ? ' · Telegram' : ''}${off ? ` · desligado (${{ saiu: 'saiu', removido: 'removido pelo dono', expirou: 'convite venceu' }[p.saida] || 'fora'})` : ''}</div></div>
      ${e.ativos.includes(p.id) ? '<span class="vivo" title="trabalhando"></span>' : ''}
      <span class="n">${contagem(p.id)}</span></div>`;
  }).join('') || '<div class="pa" style="padding:8px">Ninguém aqui ainda.</div>';
  $('lista').querySelectorAll('.pp').forEach((d) => d.onclick = () => { sel = sel === d.dataset.id ? null : d.dataset.id; render(); });
  // conversas
  const convs = ['painel', ...new Set(e.eventos.map((x) => x.conversa).filter((c) => c !== 'painel'))];
  $('conversa').innerHTML = `<option value="todas">Todas as conversas</option>` + convs.map((c) => `<option value="${c}" ${c === conversa ? 'selected' : ''}>${esc(nomeConversa(c))}</option>`).join('');
  $('filtro').innerHTML = sel ? `Mostrando só ${esc(part(sel).nome)} <button type="button" id="limpa">limpar</button>` : '';
  if (sel) $('limpa').onclick = () => { sel = null; render(); };
  // mensagens
  const box = $('msgs');
  const noFim = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const top = selTop && e.topicos.find((t) => t.id === selTop);
  const rodTop = top ? new Set(top.rodadas) : null;
  const evs = e.eventos.filter((x) => (conversa === 'todas' || x.conversa === conversa) && (!sel || x.de === sel || x.para === sel) && (!rodTop || rodTop.has(x.rodada))).slice(-250);
  box.innerHTML = evs.map((x) => {
    const de = part(x.de), para = part(x.para), c = classe(de);
    const selo = { ferramenta: 'usa ferramenta', resultado: 'resultado', rascunho: `rascunho · aguarda aprovação #${x.meta?.aprovacao ?? ''}`, proposta: `proposta de agente · aprovação #${x.meta?.aprovacao ?? ''}`, aprovacao: 'aprovação', sistema: 'aviso', topico: 'tópico', pedido: `pedido de entrada · #${x.meta?.aprovacao ?? ''}` }[x.tipo];
    const eco = x.meta?.eco;
    return `<div class="m ${x.tipo} ${x.de === eu ? 'meu' : ''} ${eco ? 'eco' : ''}">
      <div class="c"><span class="t-${c}">${icone(c)}</span><b>${esc(de.nome)}</b>${x.para && x.para !== 'sala' ? ` → ${esc(para.nome)}` : ''} · ${hora(x.hora)}
      ${selo ? `<span class="tg">${selo}</span>` : ''}${eco ? '<span class="tg" title="resposta que só confirma: não chamou ninguém">só confirma</span>' : ''}${conversa === 'todas' && x.conversa !== 'painel' ? `<span class="tg">${esc(nomeConversa(x.conversa))}</span>` : ''}</div>
      <div class="x">${esc(x.texto)}</div>${x.meta?.ms && x.tipo !== 'rascunho' ? `<div class="tempo">${Math.round(x.meta.ms / 100) / 10}s</div>` : ''}</div>`;
  }).join('') || '<div class="pa">Sem mensagens ainda. Escreva abaixo ou mande algo para o bot no Telegram.</div>';
  if (noFim) box.scrollTop = box.scrollHeight;
  topicos();
}

// ---------- Tópicos: lista à direita e resumo no alto do chat ----------
const ESTADO_TXT = { 'em debate': 'em debate', decidido: 'decidido', parado: 'parado' };
function estadoDe(t, rs) {
  if (t.rodadas.some((id) => rs.get(String(id)) && resolucao(rs.get(String(id)), S.estado).pendentes.length)) return 'em debate';
  if (t.estado === 'em debate' && Date.now() - Date.parse(t.atualizado) > 2 * 3600e3) return 'parado';
  return t.estado;
}
function somar(t, rs) {
  const out = { respostas: 0, ms: 0, ecos: 0, decidido: [], pendentes: [], gente: new Set(), msgs: 0 };
  for (const id of t.rodadas) {
    const r = rs.get(String(id));
    if (!r) continue;
    const x = resolucao(r, S.estado);
    out.respostas += x.respostas; out.ms += x.ms; out.ecos += x.ecos;
    out.decidido.push(...x.decidido); out.pendentes.push(...x.pendentes);
    for (const ev of r.eventos) {
      if (['pessoa', 'agente'].includes(part(ev.de).tipo) && ev.tipo !== 'topico') out.gente.add(ev.de);
      if (ev.tipo === 'mensagem' || ev.tipo === 'resposta') out.msgs++;
    }
  }
  return out;
}
function itemTopico(t, rs) {
  const est = estadoDe(t, rs), so = somar(t, rs);
  return `<button class="top ${selTop === t.id ? 'on' : ''}" data-top="${t.id}">
    <span class="tt">${esc(t.titulo)}</span>
    <span class="ts"><span class="tg ${est === 'em debate' ? 'destaque' : est === 'decidido' ? 'ok' : ''}">${ESTADO_TXT[est] || est}</span>
      ${so.msgs} msg · ${hora(t.atualizado)}${t.conversa !== 'painel' ? ` · ${esc(nomeConversa(t.conversa))}` : ''}</span>
    <span class="tq">${[...so.gente].map((id) => esc(part(id).nome)).join(', ')}</span>
  </button>`;
}
function topicos() {
  const e = S.estado, rs = new Map(rodadas(e.eventos).map((r) => [r.chave, r]));
  const lista = (e.topicos || []).map((t) => ({ t, est: estadoDe(t, rs) }));
  const ativos = lista.filter((x) => x.est === 'em debate'), resto = lista.filter((x) => x.est !== 'em debate');
  $('n-top').textContent = ativos.length ? `(${ativos.length})` : '';
  const quem = e.agente_topicos ? `Resumo escrito por @${esc(e.agente_topicos)}.` : 'A sala agrupa as mensagens; o resumo escrito aparece quando o agente @topicos estiver aprovado.';
  $('topicos').innerHTML = `<h3>Tópicos</h3><p class="nota">${quem}</p>
    ${ativos.length ? `<div class="grupo"><h4>Em debate</h4>${ativos.map((x) => itemTopico(x.t, rs)).join('')}</div>` : '<p class="nota">Nenhum tópico em debate agora.</p>'}
    ${resto.length ? `<details class="grupo" ${resto.some((x) => x.t.id === selTop) ? 'open' : ''}><summary>Decididos e parados (${resto.length})</summary>${resto.map((x) => itemTopico(x.t, rs)).join('')}</details>` : ''}`;
  $('topicos').querySelectorAll('[data-top]').forEach((b) => b.onclick = () => {
    const id = Number(b.dataset.top);
    selTop = selTop === id ? null : id;
    verAba('conversa');
    render();
  });
  // Cartão de resumo do tópico aberto.
  const t = selTop && (e.topicos || []).find((x) => x.id === selTop);
  const box = $('resumo');
  box.hidden = !t;
  if (!t) return;
  const est = estadoDe(t, rs), so = somar(t, rs);
  const lista2 = (itens, vazio) => itens.length ? `<ul>${itens.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>` : `<p class="mut">${vazio}</p>`;
  const resumo = t.resumo || (e.agente_topicos ? 'Agrupado pela sala (o @topicos não resumiu esta parte).' : 'Sem resumo escrito: aprove o agente @topicos para ter resumo, decisões e pendências escritas.');
  box.innerHTML = `<details open><summary><b>${esc(t.titulo)}</b> <span class="tg ${est === 'em debate' ? 'destaque' : est === 'decidido' ? 'ok' : ''}">${ESTADO_TXT[est] || est}</span></summary>
    <div class="rt-grade">
      <div><h4>Resumo</h4><p>${esc(resumo)}</p></div>
      <div><h4>Decidido</h4>${lista2([...t.decidido, ...so.decidido], 'Nada decidido ainda.')}</div>
      <div><h4>Pendente</h4>${lista2([...t.pendente, ...so.pendentes], 'Nada esperando.')}</div>
      <div><h4>Quem participou</h4><p>${[...so.gente].map((id) => esc(part(id).nome)).join(', ') || '—'}</p>
        <h4>Custo</h4><p>${so.respostas} resposta${so.respostas === 1 ? '' : 's'} de agentes${so.ecos ? ` (${so.ecos} só confirmando)` : ''} · ${String(Math.round(so.ms / 100) / 10).replace('.', ',')} s</p></div>
    </div>
    <div class="acoes"><a class="btn" href="/fluxo?v=visual&rodadas=${t.rodadas.join(',')}">Ver o fluxo</a><button class="btn" type="button" id="fecha-top">Fechar tópico</button></div>
  </details>`;
  $('fecha-top').onclick = () => { selTop = null; render(); };
}
function alertaInline(box, msg) { const d = document.createElement('div'); d.className = 'q'; d.style.color = 'var(--bad)'; d.textContent = msg; box.append(d); }
render();
$('msgs').scrollTop = $('msgs').scrollHeight;
</script>
</body>
</html>
