<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sala multiplayer · Fluxo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<div class="fluxo-topo">
  <div class="modo" role="group" aria-label="modo de ver o fluxo">
    <button class="tab" data-modo="texto">Texto</button>
    <button class="tab" data-modo="visual">Visual</button>
    <button class="tab" data-modo="grafo">Grafo</button>
  </div>
  <p id="explica"></p>
  <button class="btn" id="todas" hidden>Abrir todas</button>
  <button class="btn" id="pausa">Pausar</button>
</div>
<div class="fluxo-cab" id="cab">
  <button class="tab on" data-t="todos">Todos</button>
  <button class="tab on" data-t="pessoa">Pessoas</button>
  <button class="tab on" data-t="agente">Agentes</button>
  <button class="tab on" data-t="ferramenta">Ferramentas</button>
  <button class="tab on" data-t="sistema">Avisos</button>
</div>
<div class="fluxo-filtro" id="filtro" hidden></div>
<main class="fluxo" id="fluxo"></main>
<main class="visual" id="visual" hidden></main>
<script type="module">
import { S, iniciar, nav, icone, esc, hora, part, classe, nomeConversa } from '/comum.js';
import { rodadas, resolucao } from '/rodadas.js';
const ligados = new Set(['pessoa', 'agente', 'ferramenta', 'sistema']);
const $ = (id) => document.getElementById(id);
const url = new URLSearchParams(location.search);
let pausado = false;
let modo = url.get('v') || (() => { try { return localStorage.getItem('sala-fluxo-modo'); } catch { return null; } })() || 'texto';
// Filtro vindo de um tópico ou de um link: só estas rodadas.
const soRodadas = url.get('rodadas') ? new Set(url.get('rodadas').split(',').map(String)) : null;
const abertas = new Set(url.get('rodada') ? [url.get('rodada')] : []);
let primeira = true, todas = false; // todas: abre também as rodadas que chegarem depois
const box = $('fluxo'), vis = $('visual');

await iniciar((tipo, d) => {
  if (pausado) return;
  if (tipo === 'evento') { if (modo === 'texto') add(d); else agendar(); }
  if ((tipo === 'aprovacao' || tipo === 'topico') && modo !== 'texto') agendar();
});
nav('fluxo');
const TIPOS = ['pessoa', 'agente', 'ferramenta', 'sistema'];
function marcarCab() {
  document.querySelectorAll('#cab .tab').forEach((x) => x.classList.toggle('on', x.dataset.t === 'todos' ? ligados.size === TIPOS.length : ligados.has(x.dataset.t)));
}
document.querySelectorAll('#cab .tab').forEach((b) => b.onclick = () => {
  const t = b.dataset.t;
  if (t === 'todos') TIPOS.forEach((x) => ligados.add(x));
  else ligados.has(t) ? ligados.delete(t) : ligados.add(t);
  marcarCab(); tudo();
});
$('todas').onclick = () => {
  todas = !todas;
  if (!todas) abertas.clear();
  visual();
};
$('pausa').onclick = (e) => { pausado = !pausado; e.target.textContent = pausado ? 'Continuar' : 'Pausar'; if (!pausado) desenhar(); };
document.querySelectorAll('.modo .tab').forEach((b) => b.onclick = () => trocar(b.dataset.modo));
if (soRodadas) { $('filtro').hidden = false; $('filtro').innerHTML = `Mostrando ${soRodadas.size} rodada(s) de um tópico <a href="/fluxo">ver tudo</a>`; }

function trocar(m) {
  modo = ['visual', 'grafo'].includes(m) ? m : 'texto';
  try { localStorage.setItem('sala-fluxo-modo', modo); } catch { /* sem storage */ }
  const u = new URL(location.href); u.searchParams.set('v', modo); history.replaceState(null, '', u);
  document.querySelectorAll('.modo .tab').forEach((b) => b.classList.toggle('on', b.dataset.modo === modo));
  const rod = modo !== 'texto';
  $('cab').hidden = rod; $('todas').hidden = !rod;
  box.hidden = rod; vis.hidden = !rod;
  $('explica').textContent = modo === 'visual'
    ? 'Uma rodada por mensagem de pessoa: quem chamou quem, na ordem, e como terminou. Clique numa seta para ler a mensagem inteira.'
    : modo === 'grafo'
      ? 'Uma rodada por mensagem de pessoa, em grafo: cada círculo é um participante e cada seta leva o número do passo. A lista embaixo diz o que foi cada passo.'
      : 'Tudo o que passa pela sala, na ordem em que chega: Telegram, painel, agentes, ferramentas e avisos.';
  desenhar();
}
function desenhar() { modo === 'texto' ? tudo() : visual(); }
let timer = null;
function agendar() { clearTimeout(timer); timer = setTimeout(visual, 250); }

// ---------- Texto (como antes) ----------
function linha(e) {
  const de = part(e.de), c = classe(de);
  if (!ligados.has(de.tipo === 'pessoa' ? 'pessoa' : de.tipo)) return '';
  if (soRodadas && !soRodadas.has(String(e.rodada))) return '';
  return `<div class="fl ${e.meta?.eco ? 'eco' : ''}"><span class="h mono">${hora(e.hora)}</span>
    <span class="q"><span class="t-${c}">${icone(c)}</span><b>${esc(de.nome)}</b>&nbsp;→ ${esc(part(e.para).nome)}</span>
    <span class="x">${e.conversa !== 'painel' ? `<span class="tg">${esc(nomeConversa(e.conversa))}</span> ` : ''}${e.tipo !== 'mensagem' && e.tipo !== 'resposta' ? `<span class="tg">${e.tipo}</span> ` : ''}${e.meta?.eco ? '<span class="tg">só confirma</span> ' : ''}${esc(e.texto)}</span></div>`;
}
function add(e) {
  const fim = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.insertAdjacentHTML('beforeend', linha(e));
  while (box.children.length > 600) box.firstElementChild.remove();
  if (fim) box.scrollTop = box.scrollHeight;
}
function tudo() {
  box.innerHTML = S.estado.eventos.map(linha).join('') || '<div class="fl"><span></span><span class="x">Nada ainda.</span></div>';
  box.scrollTop = box.scrollHeight;
}

// ---------- Visual: diagrama de sequência por rodada + faixa de resolução ----------
const MARCA = {
  proposta: (e) => `proposta #${e.meta?.aprovacao ?? ''}`, rascunho: (e) => `rascunho #${e.meta?.aprovacao ?? ''}`,
  ferramenta: () => 'usa ferramenta', resultado: () => 'resultado', pedido: (e) => `pedido #${e.meta?.aprovacao ?? ''}`,
  topico: (e) => `tópico #${e.meta?.topico ?? ''}`,
};
function marca(e) {
  if (e.tipo === 'sistema') return /^Teto/.test(e.texto) ? ['teto', 'ruim'] : /falhou/.test(e.texto) ? ['falhou', 'ruim'] : ['aviso', ''];
  if (e.meta?.eco) return ['só confirma', 'apagado'];
  if (MARCA[e.tipo]) return [MARCA[e.tipo](e), e.tipo === 'proposta' || e.tipo === 'rascunho' ? 'destaque' : ''];
  return null;
}
const ORDEM = { pessoa: 0, agente: 1, ferramenta: 2, sistema: 3 };
function colunas(evs) {
  const ids = [];
  for (const e of evs) for (const id of [e.de, e.para]) if (id && id !== 'sala' && !ids.includes(id)) ids.push(id);
  return ids.sort((a, b) => (ORDEM[part(a).tipo] ?? 3) - (ORDEM[part(b).tipo] ?? 3) || ids.indexOf(a) - ids.indexOf(b));
}
function seta(e, cols, ramo, nRamos) {
  const a = cols.indexOf(e.de), bRaw = cols.indexOf(e.para), b = bRaw < 0 ? a : bRaw;
  const ini = Math.min(a, b), fim = Math.max(a, b), k = fim - ini + 1;
  const m = marca(e), dir = b > a ? 'dir' : b < a ? 'esq' : 'auto';
  const c = classe(part(e.de));
  const curto = e.texto.replace(/\s+/g, ' ').slice(0, 90);
  return `<div class="sq-linha ${e.meta?.eco ? 'eco' : ''}" style="--n:${cols.length}">
    ${nRamos > 1 && ramo != null ? `<span class="ramo" title="ramo ${ramo + 1} de ${nRamos}">${ramo + 1}</span>` : ''}
    <button class="sq-seta ${dir} t-${c}" style="grid-column:${ini + 1} / ${fim + 2};--k:${k}" aria-expanded="false" title="${esc(part(e.de).nome)} → ${esc(part(e.para).nome)}">
      <span class="rot">${m ? `<span class="tg ${m[1]}">${esc(m[0])}</span>` : ''}<span class="txt">${esc(curto)}</span></span>
      <span class="traco" aria-hidden="true"></span>
    </button>
    <div class="sq-cheio" hidden><span class="mono">${hora(e.hora)}</span> · <b>${esc(part(e.de).nome)}</b> → ${esc(part(e.para).nome)}${e.meta?.ms ? ` · ${Math.round(e.meta.ms / 100) / 10}s` : ''}<div class="x">${esc(e.texto)}</div></div>
  </div>`;
}
// Grafo da rodada: participantes em círculo, setas numeradas na ordem dos passos.
// total: grafo do tópico inteiro (várias rodadas); as setas levam quantas mensagens passaram, não o passo.
function grafo(evs, cols, total = false) {
  // Largura do desenho perto da largura real (celular, ou meia tela com os dois grafos lado a lado) para as letras não encolherem.
  const vw = innerWidth, W = vw < 600 ? 360 : vw < 900 ? 640 : vw < 1600 ? 460 : 640, estreito = W < 500;
  const H = cols.length > 2 ? (estreito ? 300 : 330) : 170, R = 24, M = estreito ? 70 : 140;
  const pos = cols.map((_, i) => {
    if (cols.length <= 2) return [cols.length === 1 ? W / 2 : M + i * (W - 2 * M), H / 2 - 10];
    const ang = Math.PI + (2 * Math.PI * i) / cols.length;
    return [W / 2 + Math.cos(ang) * (W / 2 - M + 30), H / 2 - 10 + Math.sin(ang) * (H / 2 - 60)];
  });
  const passos = evs.filter((e) => cols.includes(e.de));
  const pares = new Map();
  passos.forEach((e, i) => {
    const b = cols.indexOf(e.para), a = cols.indexOf(e.de);
    const k = `${a}>${b < 0 ? a : b}`;
    if (!pares.has(k)) pares.set(k, { a, b: b < 0 ? a : b, n: [], eco: true });
    const p = pares.get(k); p.n.push(i + 1); if (!e.meta?.eco) p.eco = false;
  });
  const arestas = [...pares.values()].map((p) => {
    const [x1, y1] = pos[p.a], [x2, y2] = pos[p.b];
    const rot = total ? `${p.n.length}×` : p.n.length > 4 ? `${p.n.slice(0, 3).join(' · ')} … ${p.n.at(-1)}` : p.n.join(' · ');
    if (p.a === p.b) { // aviso ou ferramenta sem destino: laço no próprio círculo
      const d = `M${x1 - 10},${y1 - R + 2} C${x1 - 40},${y1 - R - 46} ${x1 + 40},${y1 - R - 46} ${x1 + 10},${y1 - R + 2}`;
      return `<g class="ga ${p.eco ? 'eco' : ''}"><path d="${d}" marker-end="url(#pt)"/><text x="${x1}" y="${y1 - R - 40}">${rot}</text></g>`;
    }
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const sx = x1 + ux * R, sy = y1 + uy * R, ex = x2 - ux * (R + 4), ey = y2 - uy * (R + 4);
    const cx = (sx + ex) / 2 - uy * 34, cy = (sy + ey) / 2 + ux * 34; // curva para a direita: ida e volta não se cobrem
    // Rótulo no meio da curva, puxado para fora dela: ida e volta entre os mesmos dois não se sobrepõem.
    const nx = -uy, ny = ux, lx = (sx + 2 * cx + ex) / 4 + nx * 6, ly = (sy + 2 * cy + ey) / 4 + ny * 6 + 4;
    const anc = nx > 0.35 ? 'start' : nx < -0.35 ? 'end' : 'middle';
    return `<g class="ga ${p.eco ? 'eco' : ''}"><path d="M${sx},${sy} Q${cx},${cy} ${ex},${ey}" marker-end="url(#pt)"/><text x="${lx}" y="${ly}" text-anchor="${anc}">${rot}</text></g>`;
  }).join('');
  const nos = cols.map((id, i) => {
    const p = part(id), c = classe(p), [x, y] = pos[i];
    const ini = esc(p.nome.replace(/\(.*\)/, '').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase());
    return `<g class="gn t-${c}"><circle cx="${x}" cy="${y}" r="${R}"/><text class="ini" x="${x}" y="${y + 5}">${ini}</text><text class="nome" x="${x}" y="${y + R + 18}">${esc(p.nome)}</text></g>`;
  }).join('');
  const lista = passos.map((e, i) => {
    const m = marca(e);
    return `<li${e.meta?.eco ? ' class="eco"' : ''}><b>${esc(part(e.de).nome)}</b> → ${esc(part(e.para).nome)} ${m ? `<span class="tg ${m[1]}">${esc(m[0])}</span>` : ''} <span class="mut">${esc(e.texto.replace(/\s+/g, ' ').slice(0, 110))}</span></li>`;
  }).join('');
  return `<div class="gr">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="grafo da rodada">
      <defs><marker id="pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mut)"/></marker></defs>
      ${arestas}${nos}
    </svg>
    ${total ? '' : `<ol class="gr-passos">${lista}</ol>`}
  </div>`;
}
// Tópico da rodada e o grafo de todas as rodadas dele que estão carregadas.
let porChave = new Map();
function grafoTopico(r) {
  const t = (S.estado.topicos || []).find((x) => x.rodadas.map(String).includes(r.chave));
  if (!t) return `<div class="gr-top"><h4>Tópico</h4><p class="mut">Esta rodada ainda não está em nenhum tópico${r.aprox ? ' (mensagens de antes da v0.5)' : ''}.</p></div>`;
  const rs = t.rodadas.map((id) => porChave.get(String(id))).filter(Boolean);
  const evs = rs.flatMap((x) => x.eventos.filter((e) => e.tipo !== 'aprovacao'));
  const fora = t.rodadas.length - rs.length;
  return `<div class="gr-top"><h4>Tópico inteiro · ${esc(t.titulo)}</h4>
    <p class="mut">${rs.length} rodada${rs.length === 1 ? '' : 's'} · ${evs.length} mensagens${fora ? ` · ${fora} rodada${fora === 1 ? '' : 's'} antiga${fora === 1 ? '' : 's'} fora da lista carregada` : ''}. Cada seta mostra quantas mensagens passaram por ela.</p>
    ${grafo(evs, colunas(evs), true)}
    ${soRodadas ? '' : `<a class="mut" href="/fluxo?v=grafo&rodadas=${t.rodadas.join(',')}">ver só as rodadas deste tópico</a>`}</div>`;
}
function bloco(r) {
  const evs = r.eventos.filter((e) => e.tipo !== 'aprovacao');
  const cols = colunas(evs);
  const res = resolucao(r, S.estado);
  const aberta = todas || abertas.has(r.chave);
  const vidas = cols.map((_, i) => `linear-gradient(var(--line),var(--line)) ${((i + 0.5) / cols.length) * 100}% 0/1px 100% no-repeat`).join(',');
  const lista = (itens, vazio) => itens.length ? `<ul>${itens.map((i) => `<li>${i}</li>`).join('')}</ul>` : `<p class="mut">${vazio}</p>`;
  return `<section class="rodada ${aberta ? 'aberta' : ''}" data-chave="${r.chave}">
    <button class="rd-cab" aria-expanded="${aberta}">
      <span class="mono">${hora(r.inicio.hora)}</span>
      <span class="t-${classe(part(r.inicio.de))}">${icone(classe(part(r.inicio.de)))}</span>
      <b>${esc(part(r.inicio.de).nome)}</b>
      <span class="pedido">${esc(r.inicio.texto.replace(/\s+/g, ' ').slice(0, 120))}</span>
      <span class="chips">
        <span class="tg">${res.respostas} resposta${res.respostas === 1 ? '' : 's'}</span>
        ${res.ecos ? `<span class="tg apagado">${res.ecos} só confirma</span>` : ''}
        ${res.tetos.length ? `<span class="tg ruim">teto</span>` : ''}
        ${res.pendentes.length ? `<span class="tg destaque">${res.pendentes.length} pendente${res.pendentes.length === 1 ? '' : 's'}</span>` : ''}
        ${r.aprox ? '<span class="tg" title="mensagens de antes da v0.5, agrupadas pela hora">aproximado</span>' : ''}
      </span>
    </button>
    ${aberta ? `<div class="rd-corpo ${modo === 'grafo' ? 'com-grafo' : ''}">
      ${modo === 'grafo' ? `<div class="gr-par"><div><h4 class="gr-tit">Esta rodada</h4>${grafo(evs, cols)}</div>${grafoTopico(r)}</div>` : `<div class="sq">
        <div class="sq-cols" style="--n:${cols.length}">${cols.map((id) => { const p = part(id), c = classe(p); return `<span class="t-${c}" title="${esc(p.nome)}">${icone(c)}<span>${esc(p.nome)}</span></span>`; }).join('')}</div>
        <div class="sq-corpo" style="background:${vidas}">${evs.map((e) => seta(e, cols, r.ramo.get(e.id), r.nRamos)).join('')}</div>
      </div>`}
      <aside class="res">
        <h4>Pedido</h4><p>${esc(r.inicio.texto)}</p>
        <h4>Propostas</h4>${lista(res.propostas.map((p) => `#${p.id} ${esc(p.texto)} <span class="tg ${p.estado === 'pendente' ? 'destaque' : p.estado === 'recusada' ? 'ruim' : 'ok'}">${p.estado}${p.quem ? ` · ${esc(part(p.quem).nome)}` : ''}</span>`), 'Nenhuma.')}
        <h4>Decidido</h4>${lista(res.decidido.map(esc), 'Nada decidido pelo fluxo de aprovação.')}
        <h4>Pendente</h4>${lista(res.pendentes.map(esc), 'Nada esperando.')}
        ${res.tetos.length || res.falhas.length ? `<h4>Travas</h4>${lista([...res.tetos, ...res.falhas].map(esc), '')}` : ''}
        <h4>Custo</h4><p>${res.respostas} resposta${res.respostas === 1 ? '' : 's'} de agentes${res.ecos ? ` (${res.ecos} só confirmando)` : ''} · ${String(Math.round(res.ms / 100) / 10).replace('.', ',')} s · ${res.agentes.map((id) => esc(part(id).nome)).join(', ') || 'nenhum agente'}</p>
      </aside>
    </div>` : ''}
  </section>`;
}
function visual() {
  let lista = rodadas(S.estado.eventos);
  porChave = new Map(lista.map((r) => [r.chave, r]));
  if (soRodadas) lista = lista.filter((r) => soRodadas.has(String(r.chave)));
  lista.reverse();
  if (primeira && lista[0] && !abertas.size) abertas.add(lista[0].chave);
  primeira = false;
  vis.innerHTML = (lista.map(bloco).join('') || '<p class="mut" style="padding:14px">Nenhuma rodada ainda. Escreva na Sala ou mande algo para o bot.</p>')
    + `<p class="mut rodape">Mostra as últimas ${S.estado.eventos.length} mensagens da sala.</p>`;
  $('todas').textContent = todas ? 'Fechar todas' : 'Abrir todas';
  vis.querySelectorAll('.rd-cab').forEach((b) => b.onclick = () => {
    const k = b.closest('.rodada').dataset.chave;
    if (todas) { todas = false; lista.forEach((r) => abertas.add(r.chave)); } // sai do "todas" sem fechar as outras
    abertas.has(k) ? abertas.delete(k) : abertas.add(k);
    visual();
  });
  vis.querySelectorAll('.sq-seta').forEach((b) => b.onclick = () => {
    const cheio = b.parentElement.querySelector('.sq-cheio');
    cheio.hidden = !cheio.hidden; b.setAttribute('aria-expanded', String(!cheio.hidden));
  });
}
trocar(modo);
</script>
</body>
</html>
